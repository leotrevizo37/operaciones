services:
  lecturas:
    image: ${DUMA_IMAGE_NAME:-duma-lecturas}:${DUMA_IMAGE_TAG:-latest}
    build: .
    env_file: "${DUMA_ENV_FILE:-.env}"
    environment:
      DUMA_READINGS_BACKEND_PORT: 8082
      DUMA_READINGS_STANDALONE_MODE: true
    ports:
      - "${DUMA_READINGS_HOST_PORT:-8082}:8082"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
